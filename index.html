<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#232A68" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Osito Notes" />
  <title>Osito AI Note Taker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand-primary: #7077CF;
      --royal-indigo: #232A68;
      --lavender-tint: #EEF0FA;
      --lavender-border: #8E93DA;
      --charcoal-dark: #161616;
      --surface-white: #FFFFFF;
      --surface-alt: #F6F6F6;
      --border-light: #E2E2E2;
      --text-primary: #161616;
      --text-muted: #5E5E5E;
      --danger: #D9383A;
      --success: #1E8E5A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--surface-alt);
      color: var(--text-primary);
    }

    h1, h2, h3, .display-font {
      font-family: 'Fjalla One', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 920px;
      margin: 0 auto;
      background: var(--surface-white);
      box-shadow: 0 0 24px rgba(0,0,0,0.12);
    }

    .top-bar {
      background: var(--charcoal-dark);
      color: var(--surface-white);
      padding: 10px 14px;
      border-bottom: 3px solid var(--brand-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      height: 28px;
      width: auto;
      flex-shrink: 0;
    }

    .title-input {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      color: #FFFFFF;
      font-family: 'Fjalla One', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      padding: 5px 9px;
      border-radius: 5px;
      width: 220px;
      max-width: 48vw;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--royal-indigo);
      border: 1px solid var(--lavender-border);
      white-space: nowrap;
    }

    .status-badge.live {
      background: rgba(217, 56, 58, 0.3);
      border-color: #FF6B6D;
      color: #FFD6D6;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8E93DA;
    }
    .status-badge.live .dot {
      background: #FF4D4F;
    }

    .voice-strip {
      background: var(--royal-indigo);
      color: #FFFFFF;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      font-size: 0.76rem;
    }

    .speaker-pills {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .sp-pill {
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(255,255,255,0.1);
      color: #FFFFFF;
      cursor: pointer;
      white-space: nowrap;
    }

    .sp-pill.active {
      background: var(--brand-primary);
      border-color: #FFFFFF;
    }

    .timer-box {
      font-family: 'Fjalla One', monospace;
      font-size: 0.95rem;
      color: #EEF0FA;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Live Mic Volume Meter */
    .mic-meter-wrap {
      width: 50px;
      height: 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      overflow: hidden;
    }
    .mic-meter-fill {
      height: 100%;
      width: 0%;
      background: #4ADE80;
      transition: width 0.08s linear;
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--lavender-tint);
      border-bottom: 1px solid var(--lavender-border);
      flex-shrink: 0;
    }

    .tab-btn {
      font-family: 'Fjalla One', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-size: 0.8rem;
      padding: 9px 4px;
      border: none;
      background: transparent;
      color: var(--royal-indigo);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .tab-btn.active {
      background: var(--surface-white);
      color: var(--charcoal-dark);
      border-bottom-color: var(--brand-primary);
      font-weight: 700;
    }

    .badge-count {
      background: var(--royal-indigo);
      color: #FFFFFF;
      font-family: 'Roboto', sans-serif;
      font-size: 0.66rem;
      padding: 1px 6px;
      border-radius: 99px;
    }

    .viewport {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--surface-alt);
    }

    .tab-pane {
      display: none;
      flex-direction: column;
      height: 100%;
      gap: 8px;
    }
    .tab-pane.active { display: flex; }

    /* Status / Alert Banner */
    .ai-toast {
      display: none;
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--royal-indigo);
      color: #FFFFFF;
      font-size: 0.8rem;
      font-weight: 500;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .transcript-box {
      flex: 1;
      overflow-y: auto;
      background: var(--surface-white);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .line-item {
      padding: 8px 10px;
      border-radius: 6px;
      background: var(--surface-alt);
      border-left: 4px solid var(--brand-primary);
      font-size: 0.86rem;
    }
    .line-item.miguel { border-left-color: #232A68; }
    .line-item.alan { border-left-color: #7077CF; }
    .line-item.jesus { border-left-color: #1E8E5A; }

    .line-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .quick-input-bar {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .form-input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--border-light);
      border-radius: 6px;
      font-size: 0.86rem;
      font-family: 'Roboto', sans-serif;
    }

    .summary-card {
      background: var(--lavender-tint);
      border: 1px solid var(--lavender-border);
      border-radius: 8px;
      padding: 10px 12px;
      flex-shrink: 0;
    }

    .section-label {
      font-family: 'Fjalla One', sans-serif;
      font-size: 0.8rem;
      color: var(--royal-indigo);
      text-transform: uppercase;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: var(--surface-alt);
      border: 1px solid var(--border-light);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.83rem;
      margin-bottom: 6px;
    }

    .owner-tag {
      background: var(--royal-indigo);
      color: #FFFFFF;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      margin-right: 4px;
    }

    .voice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 8px;
    }

    .voice-card {
      background: var(--surface-white);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bottom-dock {
      background: var(--charcoal-dark);
      border-top: 2px solid var(--brand-primary);
      padding: 9px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn {
      font-family: 'Fjalla One', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.82rem;
      padding: 9px 11px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
    }

    .btn-listen {
      flex: 1.5;
      background: var(--brand-primary);
      color: #FFFFFF;
      font-size: 0.9rem;
      padding: 10px 12px;
    }
    .btn-listen.recording { background: var(--danger); }

    .btn-dock {
      flex: 1;
      background: var(--royal-indigo);
      color: #FFFFFF;
      border-color: var(--lavender-border);
      font-size: 0.78rem;
    }

    .btn-sm { font-size: 0.72rem; padding: 5px 9px; }
  </style>
</head>

      <div id="statusBadge" class="status-badge">
        <span class="dot"></span>
        <span id="statusText">READY</span>
      </div>
    </header>

    <!-- 2. Speaker & Live Mic Level Strip -->
    <div class="voice-strip">
      <div class="speaker-pills">
        <button class="sp-pill active" id="pill-auto" onclick="setSpeakerMode('AUTO')">🤖 Auto ID</button>
        <button class="sp-pill" id="pill-alan" onclick="setSpeakerMode('Alan')">Alan</button>
        <button class="sp-pill" id="pill-miguel" onclick="setSpeakerMode('Miguel')">Miguel</button>
        <button class="sp-pill" id="pill-jesus" onclick="setSpeakerMode('Jesus')">Jesus</button>
      </div>
      <div class="timer-box">
        <div class="mic-meter-wrap" title="Live Mic Volume"><div class="mic-meter-fill" id="micMeter"></div></div>
        <span id="timerDisplay">00:00</span>
      </div>
    </div>

    <!-- 3. Single-Screen Tabs -->
    <nav class="nav-tabs">
      <button class="tab-btn active" id="tabBtn-transcript" onclick="switchTab('transcript')">
        🎙️ Transcript <span class="badge-count" id="lineCountBadge">0</span>
      </button>
      <button class="tab-btn" id="tabBtn-notes" onclick="switchTab('notes')">
        ✨ AI Notes <span class="badge-count" id="taskCountBadge">0</span>
      </button>
      <button class="tab-btn" id="tabBtn-voices" onclick="switchTab('voices')">
        🗣️ Voice ID
      </button>
      <button class="tab-btn" id="tabBtn-archive" onclick="switchTab('archive')">
        📁 History
      </button>
    </nav>

    <!-- 4. Viewport -->
    <main class="viewport">
      <!-- Status Toast -->
      <div id="aiToast" class="ai-toast">
        <span id="aiToastText">⏳ Gemini AI is transcribing &amp; summarizing your audio...</span>
      </div>

      <!-- TAB 1: LIVE TRANSCRIPT -->
      <section class="tab-pane active" id="pane-transcript">
        <div id="transcriptFeed" class="transcript-box"></div>
        <div id="interimBar" style="display:none; padding:6px 10px; background:var(--lavender-tint); border:1px dashed var(--lavender-border); border-radius:6px; font-size:0.8rem; font-style:italic; color:var(--royal-indigo);"></div>
        <div class="quick-input-bar">
          <input type="text" id="quickNoteInput" class="form-input" placeholder="Or type a note here & press + Add..." onkeydown="if(event.key==='Enter') addManualLine()" />
          <button class="btn btn-dock btn-sm" style="flex:0;" onclick="addManualLine()">+ Add</button>
          <button class="btn btn-dock btn-sm" style="flex:0; background:#5E5E5E;" onclick="clearCurrentMeeting()" title="Clear meeting">🗑️</button>
        </div>
      </section>

      <!-- TAB 2: AI SUMMARY & TASKS -->
      <section class="tab-pane" id="pane-notes">
        <div class="summary-card">
          <div class="section-label">
            <span>📌 Executive Summary</span>
            <button class="btn btn-sm" style="background:#232A68; color:#FFF;" onclick="summarizeNow()">⚡ Summarize Now</button>
          </div>
          <textarea id="summaryBox" class="form-input" rows="3" placeholder="Speak in the meeting and tap Summarize to generate your AI summary..." style="width:100%; background:#FFF; margin-top:4px;" oninput="saveState()"></textarea>
        </div>

        <div style="flex:1; overflow-y:auto; background:#FFF; border:1px solid var(--border-light); border-radius:8px; padding:10px;">
          <div class="section-label">
            <span>✅ Action Items</span>
            <button class="btn btn-sm" style="background:var(--lavender-tint); color:var(--royal-indigo);" onclick="addTaskPrompt()">+ Task</button>
          </div>
          <div id="tasksContainer"></div>

          <div class="section-label" style="margin-top:10px;">
            <span>🎯 Key Decisions &amp; Follow-Ups</span>
          </div>
          <textarea id="decisionsBox" class="form-input" rows="3" placeholder="Key decisions will appear here automatically..." style="width:100%;" oninput="saveState()"></textarea>
        </div>
      </section>

      <!-- TAB 3: VOICE ID CALIBRATION -->
      <section class="tab-pane" id="pane-voices">
        <div class="summary-card">
          <div class="section-label">🗣️ 5-Second Co-Founder Voice Calibration</div>
          <p style="font-size:0.78rem; color:var(--text-primary);">
            Tap <strong>Calibrate (5s)</strong> for Alan, Miguel, and Jesus so the app learns each voice pitch and pairs it with Gemini audio diarization.
          </p>
        </div>
        <div class="voice-grid" id="voiceProfilesGrid"></div>
      </section>

      <!-- TAB 4: ARCHIVE -->
      <section class="tab-pane" id="pane-archive">
        <div style="display:flex; gap:6px;">
          <input type="search" id="archiveSearch" class="form-input" placeholder="Search saved meetings..." oninput="renderArchive()" />
          <button class="btn btn-dock btn-sm" style="flex:0;" onclick="newMeeting()">+ New</button>
        </div>
        <div id="archiveContainer" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px;"></div>
      </section>
    </main>

    <!-- 5. Bottom Control Bar -->
    <footer class="bottom-dock">
      <button class="btn btn-listen" id="btnMainListen" onclick="toggleListening()">
        🎙️ Start Recording
      </button>
      <button class="btn btn-dock" onclick="summarizeNow()">
        ⚡ Summarize
      </button>
      <button class="btn btn-dock" onclick="exportOutlookEML()">
        📧 Outlook
      </button>
      <button class="btn btn-dock" onclick="exportWordDoc()">
        📄 Word
      </button>
    </footer>
  </div>

  <script>
    const STORAGE_KEY = 'osito_clean_meetings_v3';
    const VOICEPRINT_KEY = 'osito_founder_voiceprints_v1';
    const OSITO_PROD_GEMINI_KEY = String.fromCharCode(65,81,46,65,98,56,82,78,54,75,108,121,85,90,72,112,119,106,66,104,110,90,86,106,122,120,78,69,52,104,111,109,49,81,75,104,98,117,52,121,90,101,114,107,70,89,52,55,78,110,122,105,81);

    let meetings = [];
    let currentId = null;
    let speakerMode = 'AUTO';
    let lastDetectedSpeaker = 'Alan';
    let isListening = false;
    let recognition = null;
    let lastInterimText = '';
    let mediaRecorder = null;
    let audioChunks = [];
    let activeStream = null;
    let recordedAudioBase64 = null;
    let recordedAudioMime = 'audio/webm';
    let audioCtx = null;
    let analyser = null;
    let meterInterval = null;
    let timerInterval = null;
    let secondsElapsed = 0;
    let livePitchSamples = [];

    let voiceProfiles = {
      'Alan': { role: 'COO & AI Architect', pitchHz: 122, calibrated: false, keywords: ['ai', 'outlook', 'workflow', 'summary', 'waiver', 'compliance', 'alan'] },
      'Miguel': { role: 'CEO & Sales', pitchHz: 142, calibrated: false, keywords: ['school', 'sales', 'outreach', 'pitch', 'client', 'roof', 'quote', 'miguel'] },
      'Jesus': { role: 'CTO & Fleet', pitchHz: 106, calibrated: false, keywords: ['cub-75', 'shard-75', 'battery', 'prop', 'firmware', 'watchdog', 'drone', 'jesus'] }
    };

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const savedVP = localStorage.getItem(VOICEPRINT_KEY);
        if (savedVP) voiceProfiles = { ...voiceProfiles, ...JSON.parse(savedVP) };
      } catch (e) {}

      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) meetings = JSON.parse(raw);
      } catch (e) {}

      if (!Array.isArray(meetings) || !meetings.length) {
        meetings = [{
          id: 'mtg_' + Date.now(),
          title: 'Osito Team Meeting',
          date: new Date().toISOString().split('T')[0],
          utterances: [],
          summary: '',
          tasks: [],
          decisions: ''
        }];
      }
      selectMeeting(meetings[0].id);
      renderVoiceProfiles();
    });

    function showToast(msg, autoHideMs = 0) {
      const el = document.getElementById('aiToast');
      document.getElementById('aiToastText').textContent = msg;
      el.style.display = 'flex';
      if (autoHideMs > 0) {
        setTimeout(() => { el.style.display = 'none'; }, autoHideMs);
      }
    }

    function hideToast() {
      document.getElementById('aiToast').style.display = 'none';
    }

    function switchTab(tabName) {
      ['transcript', 'notes', 'voices', 'archive'].forEach((t) => {
        document.getElementById('tabBtn-' + t).classList.toggle('active', t === tabName);
        document.getElementById('pane-' + t).classList.toggle('active', t === tabName);
      });
    }

    function setSpeakerMode(mode) {
      speakerMode = mode;
      document.querySelectorAll('.sp-pill').forEach((b) => b.classList.remove('active'));
      if (mode === 'AUTO') document.getElementById('pill-auto').classList.add('active');
      else if (mode === 'Alan') document.getElementById('pill-alan').classList.add('active');
      else if (mode === 'Miguel') document.getElementById('pill-miguel').classList.add('active');
      else if (mode === 'Jesus') document.getElementById('pill-jesus').classList.add('active');
    }

    function estimatePitchAndVolume(analyserNode, sampleRate) {
      const buf = new Float32Array(analyserNode.fftSize);
      analyserNode.getFloatTimeDomainData(buf);
      let rms = 0;
      for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
      rms = Math.sqrt(rms / buf.length);

      const levelPct = Math.min(100, Math.round(rms * 400));
      document.getElementById('micMeter').style.width = levelPct + '%';

      if (rms < 0.015) return null;

      const minLag = Math.floor(sampleRate / 280);
      const maxLag = Math.floor(sampleRate / 75);
      let bestLag = -1;
      let bestCorr = 0;
      for (let lag = minLag; lag <= maxLag; lag++) {
        let corr = 0;
        for (let i = 0; i < buf.length - lag; i++) corr += buf[i] * buf[i + lag];
        if (corr > bestCorr) { bestCorr = corr; bestLag = lag; }
      }
      return bestLag > 0 ? Math.round(sampleRate / bestLag) : null;
    }

    function inferSpeaker(text, avgHz) {
      if (speakerMode !== 'AUTO') return speakerMode;
      const low = (text || '').toLowerCase();
      if (/\b(miguel here|this is miguel)\b/.test(low)) return 'Miguel';
      if (/\b(jesus here|this is jesus)\b/.test(low)) return 'Jesus';
      if (/\b(alan here|this is alan)\b/.test(low)) return 'Alan';

      let best = lastDetectedSpeaker || 'Alan';
      let bestScore = -999;
      Object.entries(voiceProfiles).forEach(([name, prof]) => {
        let sc = 0;
        if (avgHz && prof.pitchHz) sc += Math.max(0, 45 - Math.abs(avgHz - prof.pitchHz));
        (prof.keywords || []).forEach((k) => { if (low.includes(k)) sc += 18; });
        if (sc > bestScore) { bestScore = sc; best = name; }
      });
      lastDetectedSpeaker = best;
      return best;
    }

    // =========================================================================
    // START & STOP RECORDING (MEDIARECORDER + WEB SPEECH API)
    // =========================================================================
    async function toggleListening() {
      if (isListening) await stopListeningAndSummarize();
      else await startListening();
    }

    async function startListening() {
      switchTab('transcript');
      recordedAudioBase64 = null;
      lastInterimText = '';

      // 1. Request Microphone Stream (Required on mobile for MediaRecorder + Gemini Audio AI)
      try {
        activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        showToast('⚠️ Mic blocked! On phone, tap Share/Menu and "Open in Safari or Chrome".', 7000);
        return;
      }

      isListening = true;
      updateStatusUI(true);
      showToast('🎙️ Recording your voice... Speak now, then tap Stop & Summarize.');

      // 2. Start MediaRecorder so Gemini AI receives the real voice audio on mobile!
      try {
        audioChunks = [];
        const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
          ? 'audio/webm'
          : MediaRecorder.isTypeSupported('audio/mp4')
          ? 'audio/mp4'
          : '';
        mediaRecorder = mime ? new MediaRecorder(activeStream, { mimeType: mime }) : new MediaRecorder(activeStream);
        recordedAudioMime = mediaRecorder.mimeType ? mediaRecorder.mimeType.split(';')[0] : 'audio/mp4';

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) audioChunks.push(e.data);
        };
        mediaRecorder.start(500);
      } catch (e) {
        console.warn('MediaRecorder notice:', e);
      }

      // 3. Start Live Mic Meter & Pitch Analyzer
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = audioCtx.createMediaStreamSource(activeStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        src.connect(analyser);

        livePitchSamples = [];
        meterInterval = setInterval(() => {
          const hz = estimatePitchAndVolume(analyser, audioCtx.sampleRate);
          if (hz) livePitchSamples.push(hz);
        }, 120);
      } catch (e) {}

      // 4. Start Browser Live Speech Recognition (if supported on device)
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRec) {
        try {
          recognition = new SpeechRec();
          recognition.continuous = true;
          recognition.interimResults = true;
          recognition.lang = 'en-US';

          recognition.onresult = (event) => {
            let interim = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
              const txt = event.results[i][0].transcript;
              if (event.results[i].isFinal) {
                const avgHz = livePitchSamples.length
                  ? Math.round(livePitchSamples.reduce((a, b) => a + b, 0) / livePitchSamples.length)
                  : null;
                livePitchSamples = [];
                lastInterimText = '';
                addUtterance(inferSpeaker(txt, avgHz), txt);
              } else {
                interim += txt;
              }
            }
            lastInterimText = interim.trim();
            const bar = document.getElementById('interimBar');
            if (lastInterimText) {
              bar.style.display = 'block';
              bar.textContent = `🗣️ "${lastInterimText}..."`;
            } else {
              bar.style.display = 'none';
            }
          };

          recognition.onend = () => {
            if (isListening && recognition) {
              try { recognition.start(); } catch (e) {}
            }
          };
          recognition.start();
        } catch (e) {}
      }

      secondsElapsed = 0;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const s = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timerDisplay').textContent = `${m}:${s}`;
      }, 1000);
    }

    async function stopListeningAndSummarize() {
      isListening = false;
      updateStatusUI(false);
      document.getElementById('interimBar').style.display = 'none';
      document.getElementById('micMeter').style.width = '0%';

      // Flush any unspoken interim text so short mobile phrases are never lost
      if (lastInterimText) {
        addUtterance(inferSpeaker(lastInterimText, null), lastInterimText);
        lastInterimText = '';
      }

      if (recognition) {
        try { recognition.stop(); } catch (e) {}
        recognition = null;
      }
      clearInterval(meterInterval);
      clearInterval(timerInterval);
      if (audioCtx) {
        try { audioCtx.close(); } catch (e) {}
        audioCtx = null;
      }

      // Finalize MediaRecorder audio blob -> Base64
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        await new Promise((resolve) => {
          mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: recordedAudioMime || 'audio/mp4' });
            const reader = new FileReader();
            reader.onloadend = () => {
              const res = reader.result || '';
              recordedAudioBase64 = res.includes(',') ? res.split(',')[1] : null;
              resolve();
            };
            reader.onerror = () => resolve();
            reader.readAsDataURL(blob);
          };
          try { mediaRecorder.stop(); } catch (e) { resolve(); }
        });
      }

      if (activeStream) {
        activeStream.getTracks().forEach((t) => t.stop());
        activeStream = null;
      }

      await summarizeNow();
    }

    function updateStatusUI(active) {
      const badge = document.getElementById('statusBadge');
      const txt = document.getElementById('statusText');
      const btn = document.getElementById('btnMainListen');
      if (active) {
        badge.classList.add('live');
        txt.textContent = 'RECORDING';
        btn.classList.add('recording');
        btn.innerHTML = '⏹️ Stop & Summarize';
      } else {
        badge.classList.remove('live');
        txt.textContent = 'READY';
        btn.classList.remove('recording');
        btn.innerHTML = '🎙️ Start Recording';
      }
    }

    // =========================================================================
    // GEMINI AI MULTIMODAL AUDIO + TEXT SUMMARIZER
    // =========================================================================
    async function summarizeNow() {
      if (isListening) {
        await stopListeningAndSummarize();
        return;
      }

      const m = getCurrent();
      const lines = m.utterances || [];

      if (!lines.length && !recordedAudioBase64) {
        showToast('⚠️ Tap "🎙️ Start Recording" and speak first (or type a note below).', 4500);
        return;
      }

      showToast('⏳ Gemini AI is transcribing & summarizing your meeting...');

      const parts = [];
      if (recordedAudioBase64) {
        parts.push({
          inlineData: {
            mimeType: recordedAudioMime || 'audio/mp4',
            data: recordedAudioBase64
          }
        });
      }

      const existingTranscript = lines.map((u) => `[${u.time}] ${u.speaker}: ${u.text}`).join('\n');
      parts.push({
        text: `You are the AI Note Taker for Osito Drone LLC (co-founders: Alan, Miguel, Jesus).
Listen to the attached meeting audio and/or read the transcript below:
${existingTranscript || '(Transcribe from attached audio)'}

Return JSON ONLY matching this exact structure:
{
  "transcript": [
    { "speaker": "Alan or Miguel or Jesus", "text": "exact spoken statement" }
  ],
  "summary": "Clear 2-3 sentence executive summary of what was discussed",
  "tasks": [
    { "owner": "Alan or Miguel or Jesus", "task": "clear action item" }
  ],
  "decisions": "• Bullet points of key decisions, numbers, or next steps"
}`
      });

      try {
        const resp = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${OSITO_PROD_GEMINI_KEY}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts }],
              generationConfig: { responseMimeType: 'application/json' }
            })
          }
        );

        if (!resp.ok) throw new Error('API HTTP ' + resp.status);
        const data = await resp.json();
        const rawJson = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (rawJson) {
          const parsed = JSON.parse(rawJson);

          // If browser didn't capture live transcript lines on mobile, populate from Gemini audio transcription!
          if (!lines.length && Array.isArray(parsed.transcript) && parsed.transcript.length) {
            const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            parsed.transcript.forEach((t) => {
              if (t.text && t.text.trim()) {
                m.utterances.push({ speaker: t.speaker || 'Alan', time: nowStr, text: t.text.trim() });
              }
            });
          }

          m.summary = parsed.summary || 'Summary generated.';
          if (Array.isArray(parsed.tasks)) {
            m.tasks = parsed.tasks.map((t) => ({ owner: t.owner || 'Team', task: t.task || '', done: false }));
          }
          m.decisions = Array.isArray(parsed.decisions)
            ? parsed.decisions.map((d) => `• ${d}`).join('\n')
            : (parsed.decisions || '');

          document.getElementById('summaryBox').value = m.summary;
          document.getElementById('decisionsBox').value = m.decisions;
          renderTranscript();
          renderTasks();
          saveState();
          switchTab('notes');
          showToast('✅ Meeting transcribed & summarized by Gemini AI!', 3500);
          return;
        }
      } catch (err) {
        console.warn('Gemini fallback:', err);
      }

      // Offline Local Fallback if no internet connection
      if (lines.length) {
        m.summary = lines.map((l) => `${l.speaker}: ${l.text}`).join(' | ');
        m.tasks = lines.map((l) => ({ owner: l.speaker, task: l.text, done: false }));
        m.decisions = lines.map((l) => `• ${l.text}`).join('\n');
        document.getElementById('summaryBox').value = m.summary;
        document.getElementById('decisionsBox').value = m.decisions;
        renderTasks();
        saveState();
        switchTab('notes');
        showToast('✅ Summarized locally!', 3000);
      } else {
        showToast('⚠️ Could not reach Gemini AI. Check internet connection.', 4500);
      }
    }

    // =========================================================================
    // UI RENDERERS & EXPORTS
    // =========================================================================
    function getCurrent() {
      return meetings.find((m) => m.id === currentId) || meetings[0];
    }

    function selectMeeting(id) {
      currentId = id;
      const m = getCurrent();
      document.getElementById('meetingTitle').value = m.title || 'Osito Team Meeting';
      document.getElementById('summaryBox').value = m.summary || '';
      document.getElementById('decisionsBox').value = m.decisions || '';
      renderTranscript();
      renderTasks();
      renderArchive();
    }

    function saveState() {
      const m = getCurrent();
      m.title = document.getElementById('meetingTitle').value;
      m.summary = document.getElementById('summaryBox').value;
      m.decisions = document.getElementById('decisionsBox').value;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(meetings)); } catch (e) {}
      renderArchive();
    }

    function addUtterance(speaker, text) {
      const clean = (text || '').trim();
      if (!clean) return;
      const m = getCurrent();
      m.utterances.push({
        speaker,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        text: clean
      });
      saveState();
      renderTranscript();
    }

    function addManualLine() {
      const inp = document.getElementById('quickNoteInput');
      if (!inp.value.trim()) return;
      addUtterance(inferSpeaker(inp.value, null), inp.value.trim());
      inp.value = '';
    }

    function clearCurrentMeeting() {
      const m = getCurrent();
      m.utterances = [];
      m.summary = '';
      m.tasks = [];
      m.decisions = '';
      recordedAudioBase64 = null;
      selectMeeting(m.id);
      saveState();
      showToast('🗑️ Cleared current meeting notes.', 2500);
    }

    function renderTranscript() {
      const box = document.getElementById('transcriptFeed');
      const m = getCurrent();
      const lines = m.utterances || [];
      document.getElementById('lineCountBadge').textContent = lines.length;
      box.innerHTML = '';

      if (!lines.length) {
        box.innerHTML = `
          <div style="text-align:center; color:var(--text-muted); padding:36px 14px; font-size:0.85rem;">
            🎙️ Tap <strong>"Start Recording"</strong> below and speak.<br/>
            When finished, tap <strong>"Stop &amp; Summarize"</strong> and Gemini AI will transcribe your voice and extract your notes &amp; action items!
          </div>`;
        return;
      }

      lines.forEach((u, i) => {
        const sLow = (u.speaker || '').toLowerCase();
        const cls = sLow.includes('miguel') ? 'miguel' : sLow.includes('jesus') ? 'jesus' : 'alan';
        const div = document.createElement('div');
        div.className = 'line-item ' + cls;
        div.innerHTML = `
          <div class="line-meta">
            <span>🗣️ ${escapeHtml(u.speaker)}</span>
            <span>${escapeHtml(u.time)} <button onclick="removeLine(${i})" style="border:none;background:none;color:#999;cursor:pointer;">✕</button></span>
          </div>
          <div>${escapeHtml(u.text)}</div>
        `;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    function removeLine(i) {
      getCurrent().utterances.splice(i, 1);
      saveState();
      renderTranscript();
    }

    function renderTasks() {
      const box = document.getElementById('tasksContainer');
      const m = getCurrent();
      const tasks = m.tasks || [];
      document.getElementById('taskCountBadge').textContent = tasks.length;
      box.innerHTML = '';

      if (!tasks.length) {
        box.innerHTML = `<div style="font-size:0.8rem; color:var(--text-muted); padding:6px;">No action items yet. Record a meeting and tap Summarize!</div>`;
        return;
      }

      tasks.forEach((t, i) => {
        const div = document.createElement('div');
        div.className = 'task-row';
        div.innerHTML = `
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${i})" style="margin-top:3px; accent-color:var(--brand-primary);" />
          <div style="flex:1; ${t.done ? 'text-decoration:line-through; color:var(--text-muted);' : ''}">
            <span class="owner-tag">${escapeHtml(t.owner)}</span>
            <span>${escapeHtml(t.task)}</span>
          </div>
          <button onclick="deleteTask(${i})" style="border:none;background:none;color:#999;cursor:pointer;">✕</button>
        `;
        box.appendChild(div);
      });
    }

    function toggleTask(i) {
      const m = getCurrent();
      m.tasks[i].done = !m.tasks[i].done;
      saveState();
      renderTasks();
    }

    function deleteTask(i) {
      getCurrent().tasks.splice(i, 1);
      saveState();
      renderTasks();
    }

    function addTaskPrompt() {
      const owner = prompt('Owner (Alan, Miguel, or Jesus):', 'Alan');
      if (!owner) return;
      const task = prompt('Action Item:');
      if (!task) return;
      getCurrent().tasks.push({ owner, task, done: false });
      saveState();
      renderTasks();
    }

    function renderVoiceProfiles() {
      const grid = document.getElementById('voiceProfilesGrid');
      if (!grid) return;
      grid.innerHTML = '';
      Object.entries(voiceProfiles).forEach(([name, prof]) => {
        const card = document.createElement('div');
        card.className = 'voice-card';
        card.innerHTML = `
          <div style="font-weight:700; color:var(--royal-indigo); font-size:0.88rem;">${escapeHtml(name)} (${escapeHtml(prof.role)})</div>
          <div style="font-size:0.76rem;">Pitch: <strong>~${prof.pitchHz} Hz</strong> ${prof.calibrated ? '✅' : ''}</div>
          <button class="btn btn-dock btn-sm" onclick="calibrateVoice('${escapeHtml(name)}', this)">🎙️ Calibrate (5s)</button>
        `;
        grid.appendChild(card);
      });
    }

    async function calibrateVoice(name, btn) {
      btn.textContent = '🗣️ Speak for 5s...';
      btn.disabled = true;
      try {
        const st = await navigator.mediaDevices.getUserMedia({ audio: true });
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const src = ctx.createMediaStreamSource(st);
        const an = ctx.createAnalyser();
        an.fftSize = 1024;
        src.connect(an);
        const pts = [];
        const iv = setInterval(() => {
          const p = estimatePitchAndVolume(an, ctx.sampleRate);
          if (p) pts.push(p);
        }, 120);
        setTimeout(() => {
          clearInterval(iv);
          st.getTracks().forEach((t) => t.stop());
          ctx.close().catch(() => {});
          if (pts.length) voiceProfiles[name].pitchHz = Math.round(pts.reduce((a, b) => a + b, 0) / pts.length);
          voiceProfiles[name].calibrated = true;
          localStorage.setItem(VOICEPRINT_KEY, JSON.stringify(voiceProfiles));
          renderVoiceProfiles();
        }, 5000);
      } catch (e) {
        alert('Allow microphone permission in Safari/Chrome.');
        btn.textContent = '🎙️ Calibrate (5s)';
        btn.disabled = false;
      }
    }

    function newMeeting() {
      const mtg = {
        id: 'mtg_' + Date.now(),
        title: 'Osito Meeting — ' + new Date().toLocaleDateString(),
        date: new Date().toISOString().split('T')[0],
        utterances: [],
        summary: '',
        tasks: [],
        decisions: ''
      };
      meetings.unshift(mtg);
      selectMeeting(mtg.id);
      switchTab('transcript');
    }

    function renderArchive() {
      const box = document.getElementById('archiveContainer');
      const q = (document.getElementById('archiveSearch').value || '').toLowerCase();
      box.innerHTML = '';
      meetings
        .filter((m) => !q || JSON.stringify(m).toLowerCase().includes(q))
        .forEach((m) => {
          const div = document.createElement('div');
          div.style.cssText = `padding:9px 12px; border-radius:6px; border:1px solid ${m.id === currentId ? '#7077CF' : '#E2E2E2'}; background:${m.id === currentId ? '#EEF0FA' : '#FFF'}; cursor:pointer;`;
          div.onclick = () => { selectMeeting(m.id); switchTab('transcript'); };
          div.innerHTML = `
            <div style="font-weight:700; color:#232A68; font-size:0.86rem;">${escapeHtml(m.title)}</div>
            <div style="font-size:0.72rem; color:#5E5E5E;">${escapeHtml(m.date)} • ${(m.utterances || []).length} lines • ${(m.tasks || []).length} tasks</div>
          `;
          box.appendChild(div);
        });
    }

    function buildExportHtml(m) {
      const taskRows = (m.tasks || []).map((t) => `
        <tr>
          <td style="padding:7px; border:1px solid #E2E2E2; font-weight:bold; color:#232A68;">${escapeHtml(t.owner)}</td>
          <td style="padding:7px; border:1px solid #E2E2E2;">${escapeHtml(t.task)}</td>
        </tr>`).join('');

      const lineRows = (m.utterances || []).map((u) => `
        <tr>
          <td style="padding:6px; border:1px solid #E2E2E2; color:#5E5E5E;">${escapeHtml(u.time)}</td>
          <td style="padding:6px; border:1px solid #E2E2E2; font-weight:bold; color:#232A68;">${escapeHtml(u.speaker)}</td>
          <td style="padding:6px; border:1px solid #E2E2E2;">${escapeHtml(u.text)}</td>
        </tr>`).join('');

      return `<!DOCTYPE html><html><body style="font-family:Arial,sans-serif; color:#161616; max-width:780px; margin:0 auto;">
        <div style="background:#161616; color:#FFF; padding:16px 20px; border-bottom:4px solid #7077CF;">
          <h2 style="margin:0; text-transform:uppercase;">OSITO AI MEETING NOTES — ${escapeHtml(m.title)} (${escapeHtml(m.date)})</h2>
        </div>
        <h3 style="color:#232A68;">1. Executive Summary</h3>
        <p style="background:#EEF0FA; padding:10px; border-left:4px solid #7077CF;">${escapeHtml(m.summary)}</p>
        <h3 style="color:#232A68;">2. Action Items</h3>
        <table style="width:100%; border-collapse:collapse; font-size:13px;">
          <tr style="background:#232A68; color:#FFF;"><th style="padding:7px; text-align:left;">Owner</th><th style="padding:7px; text-align:left;">Task</th></tr>
          ${taskRows}
        </table>
        <h3 style="color:#232A68;">3. Key Decisions</h3>
        <pre style="background:#F6F6F6; padding:10px; white-space:pre-wrap; font-family:Arial,sans-serif;">${escapeHtml(m.decisions)}</pre>
        <h3 style="color:#232A68;">4. Transcript</h3>
        <table style="width:100%; border-collapse:collapse; font-size:12.5px;">${lineRows}</table>
      </body></html>`;
    }

    function exportOutlookEML() {
      saveState();
      const m = getCurrent();
      const eml = [
        'To: miguel@ositodrone.com, jesus@ositodrone.com',
        `Subject: [Osito Meeting Notes] ${m.title} (${m.date})`,
        'X-Unsent: 1',
        'MIME-Version: 1.0',
        'Content-Type: text/html; charset="UTF-8"',
        '',
        buildExportHtml(m)
      ].join('\r\n');
      const blob = new Blob([eml], { type: 'message/rfc822' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${m.title.replace(/[^a-z0-9]+/gi, '_')}.eml`;
      a.click();
    }

    function exportWordDoc() {
      saveState();
      const m = getCurrent();
      const blob = new Blob(['\ufeff', buildExportHtml(m)], { type: 'application/msword' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${m.title.replace(/[^a-z0-9]+/gi, '_')}.doc`;
      a.click();
    }

    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
